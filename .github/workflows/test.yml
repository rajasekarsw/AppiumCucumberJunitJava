name: Mobile Automation
on:
  push:
    branches:[master]
  pull_request:
  workflow dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression"
        default: "@smoke"
  jobs:
    test:
      runs-on: obuntu-latest
      timeout-minutes: 30

      steps:
        - uses: actions/checkout@v4
        - uses: actions/setup-java@v4
          with:
            distribution: temurin
            java-version: 25
            cache: maven

        - name: Run tests
          run: >
            mvn -B clean test
            -Dcucumber.filter.tags="${{ github.event.inputs.tags || '@smoke' }}
        - name: Upload allure results
          if: always
          uses: actions/upload-artifact@v4
          with:
            name: allure-results
            path: allure-results